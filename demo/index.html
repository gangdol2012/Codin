<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #f4f4f9;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 1rem 2rem;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        main {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 0;
        }
        .cta-button {
            display: inline-block;
            background: #3498db;
            color: #fff;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 1rem;
            transition: background 0.3s ease;
        }
        .cta-button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to CodeCraft</h1>
    </header>
    <main>
        <h2>Your Next Big Idea Starts Here</h2>
        <p>This is a demo page generated by CodeCraft. It's designed to be clean, responsive, and easy to customize.</p>
        <p>Explore the features of our IDE and start building something amazing today!</p>
        <a href="#" class="cta-button">Get Started</a>
    </main>
</body>
</html>
