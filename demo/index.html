<!DOCTYPE html>
<html>
<head>
    <title>Optimal Auto-Snake Demo</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        #board { line-height: 1.1; font-size: 18px; white-space: pre; border: 2px solid #333; padding: 10px; margin-top: 20px; }
        h1 { margin-bottom: 0; }
    </style>
</head>
<body>
    <h1>Optimal Auto-Snake</h1>
    <div id="status">HTML/JS Web Version</div>
    <div id="board"></div>
    <div id="score">Score: 0</div>

    <script>
        const WIDTH = 40;
        const HEIGHT = 20;
        let snake = [{x: 20, y: 10}, {x: 19, y: 10}, {x: 18, y: 10}];
        let food = {x: 5, y: 5};
        let score = 0;

        function spawnFood() {
            while(true) {
                let f = {x: Math.floor(Math.random() * (WIDTH-2)) + 1, y: Math.floor(Math.random() * (HEIGHT-2)) + 1};
                if (!snake.some(s => s.x === f.x && s.y === f.y)) return f;
            }
        }

        function findPath(start, target, obstacles) {
            let queue = [[start, []]];
            let visited = new Set([`${start.x},${start.y}`]);
            while(queue.length > 0) {
                let [{x, y}, path] = queue.shift();
                if (x === target.x && y === target.y) return path;
                for (let [dx, dy] of [[1,0], [-1,0], [0,1], [0,-1]]) {
                    let nx = x+dx, ny = y+dy;
                    let key = `${nx},${ny}`;
                    if (nx > 0 && nx < WIDTH-1 && ny > 0 && ny < HEIGHT-1 && !obstacles.has(key) && !visited.has(key)) {
                        visited.add(key);
                        queue.push([{x: nx, y: ny}, [...path, {dx, dy}]]);
                    }
                }
            }
            return null;
        }

        function step() {
            let obstacleSet = new Set(snake.slice(0, -1).map(s => `${s.x},${s.y}`));
            let path = findPath(snake[0], food, obstacleSet);
            let move = null;

            if (path) {
                let next = {x: snake[0].x + path[0].dx, y: snake[0].y + path[0].dy};
                let vSnake = [next, ...snake.slice(0, -1)];
                let vObstacles = new Set(vSnake.slice(0, -1).map(s => `${s.x},${s.y}`));
                if (findPath(next, vSnake[vSnake.length-1], vObstacles)) move = path[0];
            }

            if (!move) {
                let tailPath = findPath(snake[0], snake[snake.length-1], obstacleSet);
                if (tailPath) move = tailPath[0];
            }

            if (!move) {
                for (let [dx, dy] of [[1,0], [-1,0], [0,1], [0,-1]]) {
                    let nx = snake[0].x + dx, ny = snake[0].y + dy;
                    if (nx > 0 && nx < WIDTH-1 && ny > 0 && ny < HEIGHT-1 && !snake.some(s => s.x === nx && s.y === ny)) {
                        move = {dx, dy}; break;
                    }
                }
            }

            if (move) {
                let head = {x: snake[0].x + move.dx, y: snake[0].y + move.dy};
                snake.unshift(head);
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    food = spawnFood();
                } else {
                    snake.pop();
                }
                draw();
                setTimeout(step, 30);
            } else {
                document.getElementById('status').innerText = "GAME OVER - Trapped!";
            }
        }

        function draw() {
            let out = "";
            for (let y = 0; y < HEIGHT; y++) {
                for (let x = 0; x < WIDTH; x++) {
                    if (x === 0 || x === WIDTH-1 || y === 0 || y === HEIGHT-1) out += "#";
                    else if (x === food.x && y === food.y) out += "@";
                    else if (x === snake[0].x && y === snake[0].y) out += "O";
                    else if (snake.some(s => s.x === x && s.y === y)) out += "o";
                    else out += " ";
                }
                out += "\n";
            }
            document.getElementById('board').innerText = out;
            document.getElementById('score').innerText = "Score: " + score;
        }

        food = spawnFood();
        step();
    </script>
</body>
</html>
